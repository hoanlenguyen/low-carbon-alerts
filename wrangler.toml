name = "low-carbon-alerts"
pages_build_output_dir = "dist"
compatibility_date = "2024-07-11"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "low-carbon-alerts"
database_id = "a38691b2-41c1-4d37-9a06-1a0f77c3d088"
migrations_dir = "server/database/migrations"

# RAG layer. Vectorize + Workers AI have no local simulator, so `remote = true`
# lets local dev connect to the real resources (see Cloudflare remote bindings).
[[vectorize]]
binding = "VECTORIZE"
index_name = "lca-knowledge"
remote = true

[ai]
binding = "AI"
remote = true